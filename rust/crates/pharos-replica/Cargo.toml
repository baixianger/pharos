[package]
name = "pharos-replica"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Replica SQLite store + Peer RPC (ReplicaHandle) for RFC-007 S3"

[dependencies]
pharos-protocol = { workspace = true }
pharos-store-schema = { workspace = true }
pharos-iroh = { path = "../pharos-iroh" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
