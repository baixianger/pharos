[package]
name = "pharos-mesh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Mesh node orchestration + trust pairing for RFC-007 S3"

[[bin]]
name = "pharos-mesh-node"
path = "src/bin/pharos_mesh_node.rs"

[dependencies]
pharos-protocol = { workspace = true }
pharos-store-schema = { workspace = true }
pharos-iroh = { path = "../pharos-iroh" }
pharos-replica = { path = "../pharos-replica" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
time = { workspace = true }

[dev-dependencies]
pharos-api = { workspace = true }
pharos-session = { path = "../pharos-session" }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
