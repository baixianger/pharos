[package]
name = "pharos-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "RFC-007 S1: Rust CLI — thread read/reply + grokbot serve"
autobins = false

[[bin]]
name = "pharos"
path = "src/main.rs"

[dependencies]
pharos-grokbot = { path = "../pharos-grokbot" }
pharos-protocol = { workspace = true }
pharos-thread = { path = "../pharos-thread" }
serde_json = { workspace = true }
