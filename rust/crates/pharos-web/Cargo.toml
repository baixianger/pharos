[package]
name = "pharos-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "RFC-007 S4: web server binary — static Web UI + HTTP/WS API"
autobins = false

[[bin]]
name = "pharos-web"
path = "src/main.rs"

[dependencies]
pharos-http = { workspace = true }
pharos-api = { workspace = true }
pharos-store-schema = { workspace = true }
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { workspace = true, features = ["fs", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
clap = { workspace = true, features = ["derive", "env"] }
serde_json = { workspace = true }

[dev-dependencies]
pharos-http = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
futures-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tempfile = "3"
tower = { workspace = true, features = ["util"] }
